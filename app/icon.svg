<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pitchCraftBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Sparkle Gradient -->
    <linearGradient id="sparkleAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Slide Drop Shadow -->
    <filter id="slideDropShadow" x="-15%" y="-15%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#pitchCraftBg)" />
  <rect width="504" height="504" x="4" y="4" rx="112" stroke="#38BDF8" stroke-width="6" stroke-opacity="0.45" fill="none" />

  <!-- Slide Layer 1 (Bottom) -->
  <rect x="96" y="260" width="260" height="130" rx="22" fill="#FFFFFF" fill-opacity="0.25" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3" />

  <!-- Slide Layer 2 (Middle) -->
  <rect x="116" y="198" width="270" height="136" rx="22" fill="#FFFFFF" fill-opacity="0.45" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="3" />

  <!-- Slide Layer 3 (Top Focus Slide) -->
  <g filter="url(#slideDropShadow)">
    <rect x="136" y="136" width="280" height="158" rx="22" fill="#FFFFFF" />
    
    <!-- Header title bar -->
    <rect x="168" y="166" width="100" height="16" rx="8" fill="#0284C7" />
    <circle cx="384" cy="174" r="8" fill="#E2E8F0" />

    <!-- Content bullet lines -->
    <rect x="168" y="202" width="216" height="11" rx="5.5" fill="#475569" />
    <rect x="168" y="226" width="168" height="11" rx="5.5" fill="#94A3B8" />
    <rect x="168" y="250" width="124" height="11" rx="5.5" fill="#CBD5E1" />
  </g>

  <!-- AI Synthesis Star (Top-Right) -->
  <g transform="translate(385, 115)">
    <path d="M 0 -48 Q 0 0 48 0 Q 0 0 0 48 Q 0 0 -48 0 Q 0 0 0 -48 Z" fill="url(#sparkleAmber)" />
    <circle cx="0" cy="0" r="9" fill="#FFFFFF" />
  </g>

  <!-- Secondary micro sparkle -->
  <g transform="translate(428, 168) scale(0.48)">
    <path d="M 0 -36 Q 0 0 36 0 Q 0 0 0 36 Q 0 0 -36 0 Q 0 0 0 -36 Z" fill="#FEF08A" />
  </g>
</svg>
